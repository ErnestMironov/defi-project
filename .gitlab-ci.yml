default:
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

stages:
  - build
  - cleanup
  - deploy_prod
  - deploy_dev
  - send_anime

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:$CI_COMMIT_SHA

build:
  stage: build
  script:
    - curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendMessage -d chat_id=$CHAT_BOT_ID -d text="🔨New MAAT-Frontend Build Started%0A👨‍💻$GITLAB_USER_NAME"
    - docker build . -t $IMAGE_NAME
    - docker push $IMAGE_NAME
  tags:
    - dev
  only:
    - main
    - dev

send_anime:
  stage: send_anime
  when: on_success
  allow_failure: true 
  script:
    - |
      response=$(curl -s "https://giphy.com/search/anime-hentai") && gif_urls=$(echo "$response" | grep -o 'https://media[0-9]*\.giphy\.com/media/[^"]*\.gif') && gif_array=()
      while IFS= read -r line; do
        gif_array+=("$line")
      done <<< "$gif_urls" && if [ ${#gif_array[@]} -gt 0 ]; then
      gif_url=${gif_array[$((RANDOM % ${#gif_array[@]}))]}
      curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendVideo -d chat_id=$CHAT_BOT_ID -d video=$gif_url
      else
          echo "No GIFs found."
      fi
  tags:
    - dev
  only:
    - main
    - dev

cleanup:
  stage: cleanup
  when: always
  script:
    - docker system prune -f || true
  tags:
    - dev

deploy_prod:
  stage: deploy_prod
  script:
    - curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendMessage -d chat_id=$CHAT_BOT_ID -d text="🤞Prod MAAT-Frontend Deploy Started%0A👨‍💻$GITLAB_USER_NAME"
    - git config user.email cicd@lumos.com
    - git config user.name "cicd-lumos"
    - git clone ssh://git@git.dapp-devs.com:2222/lumos-labs/lumos-infra.git lumos-infra
    - cd lumos-infra
    - (cd ioc-helm; IMAGE_TAG=$CI_COMMIT_SHA yq e '.image.tag=env(IMAGE_TAG)' -i maat-frontend/values.yaml)
    - git add .
    - git commit -m "updated MAAT-Frontend"
    - git push origin
    - curl -s -X POST https://api.telegram.org/bot$NOTIFY_TOKEN/sendMessage -d chat_id=$CHAT_NOTIFY_ID -d text="🌈Prod MAAT-Frontend Deploy Finished, wait for a sync in ArgoCD%0A👨‍💻$GITLAB_USER_NAME"
  tags:
    - dev
  only:
    - main

deploy_dev:
  stage: deploy_dev
  script:
    - curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendMessage -d chat_id=$CHAT_BOT_ID -d text="🤞Dev MAAT-Frontend Deploy Started%0A👨‍💻$GITLAB_USER_NAME"
    - git config user.email cicd@lumos.com
    - git config user.name "cicd-lumos"
    - git clone ssh://git@git.dapp-devs.com:2222/lumos-labs/lumos-infra.git lumos-infra
    - cd lumos-infra
    - (cd ioc-helm; IMAGE_TAG=$CI_COMMIT_SHA yq e '.image.tag=env(IMAGE_TAG)' -i maat-frontend/dev.yaml)
    - git add .
    - git commit -m "updated MAAT-Frontend"
    - git push origin
    - curl -s -X POST https://api.telegram.org/bot$NOTIFY_TOKEN/sendMessage -d chat_id=$CHAT_NOTIFY_ID -d text="🌈Dev MAAT-Frontend Deploy Finished, wait for a sync in ArgoCD%0A👨‍💻$GITLAB_USER_NAME"
  tags:
    - dev
  only:
    - dev
